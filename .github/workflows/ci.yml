# Her itişte testler, lint ve kurulmaya hazır bir debug APK.
#
# GitLab'daki karşılığı yalnızca test koşuyordu; APK'yı elle derlemek
# gerekiyordu. Burada APK da üretilip iş akışının çıktısına asılıyor:
# "Actions -> ilgili koşu -> Artifacts" altından indirilip telefona kurulabilir.
#
# Uygulamanın hiç dış bağımlılığı yok; kurulması gereken tek şey Android SDK'sı
# ve onu koşucu imajı hazır getiriyor.

name: CI

on:
  push:
    # Etiketler bu iş akışını tetiklemez: `branches` verildiğinde etiket
    # itişleri zaten eşleşmiyor, onlar Release iş akışına gidiyor.
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Aynı dalda üst üste itiş yapılırsa yarıda kalan koşu iptal edilsin.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Test, lint ve debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Kaynağı al
        uses: actions/checkout@v4

      # Proje jvmTarget 17 ile derleniyor; koşucunun varsayılan JDK'sına
      # güvenmek yerine sürüm açıkça sabitleniyor.
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle önbelleği ve wrapper doğrulaması. Wrapper JAR'ı depoda duruyor;
      # doğrulama onun bilinen bir Gradle sürümüne ait olduğunu sınar.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Android SDK bileşenleri
        run: bash .github/scripts/android-sdk.sh

      # Testler JVM'de koşar, öykünücü gerekmez. Lint uyarıları derlemeyi
      # kırmaz ama raporu çıktı olarak saklanır.
      - name: Testler ve lint
        run: ./gradlew test lintDebug

      - name: Debug APK
        run: ./gradlew assembleDebug

      - name: APK'yı adlandır
        id: apk
        run: bash .github/scripts/collect-apk.sh debug

      - name: APK'yı çıktıya as
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Başarısızlıkta da yüklenir: düşen testin ve lint bulgularının raporu
      # burada. Koşu günlüğü özet verir, ayrıntı bu HTML'lerde.
      - name: Test ve lint raporları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raporlar-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
