# Her itişte testler ve lint. Uygulamanın hiç dış bağımlılığı olmadığı için
# kurulması gereken tek şey Android SDK'sı; onu da hazır imaj getiriyor.
#
# İmaj sabitlenmiş bir sürüme bağlı: "latest" bir gün compileSdk'yı geçer ve
# derleme sebepsiz kırılır.
image: ghcr.io/cirruslabs/android-sdk:35

stages:
  - test

variables:
  # Gradle'ın önbelleği proje dizininde dursun ki iş adımları arasında taşınabilsin.
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache:
  key: gradle
  paths:
    - .gradle/wrapper
    - .gradle/caches

test:
  stage: test
  script:
    # Testler JVM'de koşar, öykünücü gerekmez; lint uyarıları derlemeyi kırmaz
    # ama raporu çıktı olarak saklanır.
    - ./gradlew test lintDebug
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: app/build/test-results/test*/TEST-*.xml
    paths:
      - app/build/reports/
